# PortSyncs full stack for hosting phase H1 (MochaHost VPS) and local development.
# Copy .env.example to .env and change every password before first run.
name: portsyncs

services:
  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Storage__Provider: Local
      Storage__LocalRoot: /data/files
      Messaging__Provider: InProcess
    volumes:
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080" # Nginx on the host proxies 443 -> 8080; never expose directly

  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports published: the database is reachable only inside the Docker network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    profiles: ["full"] # enabled when Cache__Provider=Redis is implemented

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    profiles: ["full"] # enabled when Messaging__Provider=RabbitMq is implemented

volumes:
  files:
  pgdata:
  redisdata:
  rabbitdata:
